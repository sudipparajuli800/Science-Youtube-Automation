name: Visual review (no publishing)

on:
  workflow_dispatch:
    inputs:
      templates:
        description: Diagram set to review
        type: choice
        default: cycle,layers
        options:
          - cycle,layers
          - transport,comparison
          - cycle,layers,transport,comparison

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Prepare local renderer
        run: |
          python -m pip install Pillow
          npm ci --prefix motion --no-audit --no-fund
          node motion/ensure-browser.mjs
      - name: Check motion timing
        run: node --test motion/tests/storytelling.test.mjs
      - name: Render portrait and landscape reviews
        env:
          REVIEW_TEMPLATES: ${{ inputs.templates }}
        run: python -m automation.tools.render_motion_review --output automation/storage/motion-review --templates "$REVIEW_TEMPLATES" --formats long,short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ github.run_id }}
          path: automation/storage/motion-review/
          if-no-files-found: error
          retention-days: 14
