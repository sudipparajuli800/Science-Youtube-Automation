name: Science Video Automation

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && format('Manual: {0}', github.event.inputs.pipeline)
    || (github.event.schedule == '15 1,12 * * *' && 'Scheduled: Science Shorts')
    || (github.event.schedule == '15 3 * * *' && 'Scheduled: Facebook/Instagram Post')
    || (github.event.schedule == '15 7 * * *' && 'Scheduled: Facebook/Instagram Post')
    || (github.event.schedule == '15 11 * * *' && 'Scheduled: Facebook/Instagram Post')
    || (github.event.schedule == '15 15 * * *' && 'Scheduled: Facebook/Instagram Post')
    || (github.event.schedule == '0 3 * * *' && 'Scheduled: AI Comment Replies')
    || 'Science Automation Run'
  }}

# NOTE: the long-form ("science_long"/daily) pipeline is intentionally not on a
# schedule below — long-form output wasn't meeting the bar and is now edited
# manually outside this automation. The pipeline code and manual-dispatch option
# are left in place (harmless, reversible) in case it's ever wanted again; it
# just never fires on its own anymore. Shorts + a new 4x/day Facebook/Instagram
# text+photo post are now the only scheduled content.
on:
  schedule:
    # Science Fact Shorts (7:00 AM & 6:30 PM NPT)
    - cron: '15 1,12 * * *'
    # Facebook/Instagram photo+caption posts, 4x/day (09:00, 13:00, 17:00, 21:00 NPT)
    - cron: '15 3 * * *'
    - cron: '15 7 * * *'
    - cron: '15 11 * * *'
    - cron: '15 15 * * *'
    # AI Comment Reply (Once daily at 3:00 AM UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Select pipeline to run'
        required: true
        default: 'all'
        type: choice
        options:
          - science
          - science_long
          - social_post
          - comments
      is_test:
        description: 'Run in test mode (no upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6
          pip install feedparser edge-tts "moviepy<2.0.0" requests beautifulsoup4 google-genai telethon python-dotenv duckduckgo-search google-api-python-client google-auth-oauthlib groq "Pillow" PyYAML elevenlabs
          
      # Captions, thumbnails and explanation cards use Pillow. No ImageMagick
      # policy edit is needed; runner-specific policy paths must not block jobs.
      - name: Create Storage Dirs
        run: mkdir -p automation/storage automation/logs

      # --- PIPELINE ROUTING ---

      - name: Run Science Facts (Shorts)
        if: |
          github.event.schedule == '15 1,12 * * *' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'science')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          HUME_API_KEY2: ${{ secrets.HUME_API_KEY2 }}
          HUME_API_KEY3: ${{ secrets.HUME_API_KEY3 }}
          HUME_API_KEY4: ${{ secrets.HUME_API_KEY4 }}
          HUME_API_KEY5: ${{ secrets.HUME_API_KEY5 }}
          HUME_VOICE_ID: ${{ secrets.HUME_VOICE_ID }}
          HUME_VOICE_ID_2: ${{ secrets.HUME_VOICE_ID_2 }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then FLAGS="--test"; fi
          python automation/main.py --mode shorts $FLAGS

      - name: Run Science Detailed (Long Form)
        # No longer scheduled — long-form is now edited manually outside this
        # automation. Left as a manual-dispatch-only option (harmless, reversible)
        # rather than deleted, in case it's ever wanted again.
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'science_long'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          HUME_API_KEY: ${{ secrets.HUME_API_KEY }}
          HUME_API_KEY2: ${{ secrets.HUME_API_KEY2 }}
          HUME_API_KEY3: ${{ secrets.HUME_API_KEY3 }}
          HUME_API_KEY4: ${{ secrets.HUME_API_KEY4 }}
          HUME_API_KEY5: ${{ secrets.HUME_API_KEY5 }}
          HUME_VOICE_ID: ${{ secrets.HUME_VOICE_ID }}
          HUME_VOICE_ID_2: ${{ secrets.HUME_VOICE_ID_2 }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then FLAGS="--test"; fi
          python automation/main.py --mode daily $FLAGS

      - name: Run Social Media Post (Facebook/Instagram)
        if: |
          github.event.schedule == '15 3 * * *' ||
          github.event.schedule == '15 7 * * *' ||
          github.event.schedule == '15 11 * * *' ||
          github.event.schedule == '15 15 * * *' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'social_post')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.is_test }}" == "true" ]; then FLAGS="--test"; fi
          python automation/main.py --mode social_post $FLAGS

      - name: Run AI Comment Replier
        if: |
          github.event.schedule == '0 3 * * *' || 
          (github.event_name == 'workflow_dispatch' && github.event.inputs.pipeline == 'comments')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2: ${{ secrets.GROQ_API_KEY2 }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: |
          python automation/main.py --mode comments

      - name: Commit State Changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add automation/storage/*.json
          git commit -m "Update automation state" || echo "No changes to commit"
          
          # Robust merge for state files
          MAX_RETRIES=5
          RETRY_COUNT=0
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]
          do
            git pull --rebase origin main && break
            echo "Merge conflict detected, attempting automated JSON merge..."
            git rebase --abort || true
            git fetch origin main
            
            # Use python for union merge
            python -c "import json, os, subprocess; [ ( (lambda f: ( (lambda d1, d2: open(f, 'w').write(json.dumps(list(set(d1)|set(d2))))) (json.load(open(f)), json.loads(subprocess.check_output(['git', 'show', 'origin/main:'+f]).decode())) ) (f) ) if os.path.exists(f) else None ) for f in ['automation/storage/posted_science.json'] ]"
            
            git add automation/storage/*.json
            git commit -m 'Update state (merged)' || echo 'Nothing to commit after merge'
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          git push origin main || echo "Push failed after retries"
